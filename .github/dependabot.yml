# Dependabot configuration
# Covers: npm (root), cargo (src-tauri), and GitHub Actions
# Strategy: group minor/patch updates; majors separate.
# Security updates are handled by GitHub alerts (no separate schedule here).

version: 2
updates:
  # NPM (frontend + Tauri CLI/plugins)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    versioning-strategy: 'increase-if-necessary'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'npm'
    ignore:
      # Tauri JS packages must stay on the same major/minor line as the
      # matching Rust crates in src-tauri/Cargo.toml.
      - dependency-name: '@tauri-apps/*'
        update-types:
          - 'version-update:semver-minor'
      - dependency-name: '@crabnebula/tauri-plugin-drag'
        update-types:
          - 'version-update:semver-minor'
      - dependency-name: 'tauri-plugin-macos-permissions-api'
        update-types:
          - 'version-update:semver-minor'
      # typescript-eslint supports TypeScript below 6.1 only, so `npm ci`
      # fails on TypeScript 7. Remove this rule when it supports 7.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      # Group routine updates to reduce PR noise
      dev-dependencies:
        applies-to: 'version-updates'
        dependency-type: 'development'
        patterns:
          - '*'
      minor-and-patch:
        applies-to: 'version-updates'
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

  # Security updates are handled by GitHub's alerts (no separate block needed)

  # Cargo (Rust, Tauri backend)
  - package-ecosystem: 'cargo'
    directory: '/src-tauri'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    versioning-strategy: 'auto'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'cargo'
    ignore:
      # 2.8.4 takes rfd 0.17.2, whose Linux dialogs read their text as a
      # printf format (#749). src-tauri/Cargo.toml says when to unpin.
      - dependency-name: 'tauri-plugin-dialog'
        versions: ['2.8.4']
    groups:
      ssh-crypto-stack:
        applies-to: 'version-updates'
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - 'russh*'
          - 'internal-russh-*'
          - 'ssh-*'
          - 'ed25519*'
          - 'curve25519-dalek*'
          - 'rsa'
          - 'ecdsa'
          - 'elliptic-curve'
          - 'p256'
          - 'p384'
          - 'p521'
          - 'pkcs*'
          - 'spki'
          - 'der'
          - 'signature'
          - 'crypto-*'
          - 'cipher'
          - 'digest'
          - 'hmac'
          - 'hkdf'
          - 'sha*'
          - 'universal-hash'
          - 'ml-kem'
          - 'kem'
      minor-and-patch:
        applies-to: 'version-updates'
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'ci'
    groups:
      minor-and-patch:
        applies-to: 'version-updates'
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
