[package]
name = "marlin"
version = "0.1.0"
description = "A modern, sleek file browser with native performance"
authors = ["Marlin Team"]
license = "MIT"
repository = "https://github.com/StirlingMarketingGroup/marlin"
edition = "2021"
rust-version = "1.99"
default-run = "marlin"

[workspace]
members = ["crates/marlin-smb", "crates/marlin-smb-client", "crates/marlin-vfs", "crates/marlin-mount", "crates/marlin-mount-client", "crates/marlin-fuse", "crates/marlin-gdrive", "crates/marlin-sftp", "crates/marlin-local-network", "crates/marlin-test-keychain", "crates/marlin-test-samba", "crates/marlin-test-sshd"]

[features]
default = []
cargo-clippy = []
# Gates the manual tests in tests/smb_integration.rs. They need a real SMB server.
smb = []
# The build that `npm run test:app` drives: it serves WebDriver on a local port and keeps secrets in memory, not in the OS keychain.
# Debug builds only. See docs/decisions/0004-real-app-tests.md.
app-test = ["dep:tauri-plugin-wdio-webdriver", "dep:marlin-test-keychain"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
marlin-mount-client = { path = "crates/marlin-mount-client" }
marlin-gdrive = { path = "crates/marlin-gdrive" }
marlin-sftp = { path = "crates/marlin-sftp" }
marlin-test-keychain = { path = "crates/marlin-test-keychain", optional = true }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2.3.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-decorum = "1.1.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-drag = "2.1.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-wdio-webdriver = { version = "1.5.1", optional = true }
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-openssl"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7.0"
tokio = { version = "1.50", features = ["full"] }
base64 = "0.23"
# Thumbnail system dependencies
image = { version = "0.25", features = ["png", "jpeg", "webp", "gif"] }
lru = "0.19"
dashmap = "6.2"
rayon = "1.12"
uuid = { version = "1.23", features = ["v4"] }
sha2 = "0.11"
hex = "0.4"
urlencoding = "2.1"
url = "2.5"
webp = { version = "0.3", optional = true }
once_cell = "1.21"
num_cpus = "1.16"
hayro = "0.9"
resvg = { version = "0.50", default-features = true }
usvg = { version = "0.50", default-features = true, features = ["text"] }
ffmpeg-sidecar = "2.5"
psd = "0.3"
# File system watching
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
walkdir = "2.5"
same-file = "1.0"
libc = "0.2"
tempfile = "3.27"
zip = { version = "9.0", default-features = false, features = ["deflate", "bzip2", "zstd"] }
tar = "0.4"
flate2 = "1.1"
bzip2 = "0.6"
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.14"
ab_glyph = "0.2"
async-trait = "0.1"
trash = "5.2.6"
zpl-rs = "0.1"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

# SFTP integration (SSH keys and known_hosts are in russh::keys)
russh = "0.61"
russh-sftp = "2.1"

# Google Drive integration
google-drive3 = "7"
yup-oauth2 = "12"
hyper = { version = "1.9", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
hyper-rustls = { version = "0.27", features = ["http2"] }
reqwest = { version = "0.13", features = ["json", "form"] }
open = "5"
bytes = "1"
mime_guess = "2.0.5"
rustls = { version = "0.23.40", features = ["ring"] }

# UnRAR's license is not open source, and WinFsp's license exception does not
# cover software linked with it. A Windows build must not link it (#569).
[target.'cfg(not(target_os = "windows"))'.dependencies]
unrar = "0.5"
# SMB is not compiled on Windows.
marlin-smb-client = { path = "crates/marlin-smb-client" }
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
tauri-plugin-macos-permissions = "2.3.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Foundation", "Win32_UI_Shell"] }
clipboard-win = "5"
remove_dir_all = { version = "1.0", features = ["parallel"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", package = "gtk" }

[dev-dependencies]
marlin-test-keychain = { path = "crates/marlin-test-keychain" }

# The tests that mount a real FUSE filesystem: run them with test-in-docker.sh.
[target.'cfg(target_os = "linux")'.dev-dependencies]
marlin-fuse = { path = "crates/marlin-fuse" }
marlin-vfs = { path = "crates/marlin-vfs" }
