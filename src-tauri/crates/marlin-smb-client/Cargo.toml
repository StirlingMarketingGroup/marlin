[package]
name = "marlin-smb-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.89"
description = "Marlin's SMB helper protocol, the client that runs `marlin-smb`, the saved SMB servers, and the read-only mount provider for one saved server."

[features]
default = ["client"]
client = ["dep:keyring", "dep:dirs", "dep:log", "dep:libc", "dep:marlin-vfs", "dep:async-trait", "dep:tokio", "dep:chrono"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"], optional = true }
dirs = { version = "7.0", optional = true }
log = { version = "0.4", optional = true }
marlin-vfs = { path = "../marlin-vfs", optional = true }
async-trait = { version = "0.1", optional = true }
tokio = { version = "1.50", features = ["rt", "sync"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3.27"
marlin-test-keychain = { path = "../marlin-test-keychain" }
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "sync", "time"] }
