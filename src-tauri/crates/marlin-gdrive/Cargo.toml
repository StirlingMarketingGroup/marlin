[package]
name = "marlin-gdrive"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.89"
description = "Marlin's Google Drive provider for native mounts, and the saved Google sign-in the app and the mount helper share."

[dependencies]
marlin-vfs = { path = "../marlin-vfs" }
async-trait = "0.1"
reqwest = { version = "0.13", features = ["query", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1.50", features = ["time", "sync"] }
fastrand = "2"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
dirs = "7.0"

[build-dependencies]
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "sync", "time"] }
wiremock = "0.6"
tempfile = "3.27"
marlin-test-keychain = { path = "../marlin-test-keychain" }
