[package]
name = "marlin-sftp"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.89"
description = "Marlin's saved SFTP servers, their host key check, the connection, and the read-only provider for mounts."

[dependencies]
russh = "0.61"
russh-sftp = "2.1"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
dirs = "7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["time", "sync", "rt", "macros", "io-util", "net"] }
marlin-vfs = { path = "../marlin-vfs" }
marlin-local-network = { path = "../marlin-local-network" }
async-trait = "0.1"
futures-util = "0.3"
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "net"] }
tempfile = "3.27"
rand = "0.10"
marlin-test-keychain = { path = "../marlin-test-keychain" }
marlin-test-sshd = { path = "../marlin-test-sshd" }
