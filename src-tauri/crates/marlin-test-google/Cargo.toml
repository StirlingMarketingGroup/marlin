[package]
name = "marlin-test-google"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.89"
description = "A fake Google for Marlin's tests only: the Drive API, the token endpoint, the sign-in page, and the user info."

[dependencies]
wiremock = "0.6"
serde_json = "1.0"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "io-util", "io-std"] }
