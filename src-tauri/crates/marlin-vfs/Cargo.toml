[package]
name = "marlin-vfs"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Marlin's virtual filesystem core: what every mount adapter and every storage provider share."

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1.50", features = ["macros", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
