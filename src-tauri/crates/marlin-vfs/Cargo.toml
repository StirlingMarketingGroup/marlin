[package]
name = "marlin-vfs"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Marlin's virtual filesystem core: what every mount adapter and every storage provider share."

[dependencies]
async-trait = "0.1"
tokio = { version = "1.50", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
