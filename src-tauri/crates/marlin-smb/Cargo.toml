[package]
name = "marlin-smb"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Marlin's SMB helper process. Keeps libsmbclient out of the main app."

[dependencies]
serde = "1.0"
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
pavao = "0.3"
marlin-smb-client = { path = "../marlin-smb-client", default-features = false }

[dev-dependencies]
marlin-test-samba = { path = "../marlin-test-samba" }
libc = "0.2"
marlin-smb-client = { path = "../marlin-smb-client" }
marlin-vfs = { path = "../marlin-vfs" }
marlin-test-keychain = { path = "../marlin-test-keychain" }
tempfile = "3.27"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread"] }
