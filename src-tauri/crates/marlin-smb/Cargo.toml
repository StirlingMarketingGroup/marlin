[package]
name = "marlin-smb"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Marlin's SMB helper process. Keeps libsmbclient out of the main app."

[dependencies]
serde_json = "1.0"
once_cell = "1.21"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
pavao = "0.3"
marlin-smb-client = { path = "../marlin-smb-client", default-features = false }
