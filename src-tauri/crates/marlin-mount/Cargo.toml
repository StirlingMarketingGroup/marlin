[package]
name = "marlin-mount"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.89"
description = "Marlin's mount helper: one process per user that owns every mount."

[dependencies]
marlin-mount-client = { path = "../marlin-mount-client" }
marlin-vfs = { path = "../marlin-vfs" }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time", "process"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "7.0"
regex = "1"

[target.'cfg(target_os = "linux")'.dependencies]
marlin-fuse = { path = "../marlin-fuse" }

# For the dead-mount check of the adapter in main.rs that every other Unix gets.
[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
