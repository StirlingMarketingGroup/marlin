[package]
name = "marlin-mount"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.89"
description = "Marlin's mount helper: one process per socket that owns every mount."

[features]
# The helper of the build that `npm run test:app` drives: it keeps secrets in the test keychain and talks to a fake Google. Debug builds only.
app-test = ["dep:marlin-test-keychain", "marlin-gdrive/app-test"]

[dependencies]
marlin-mount-client = { path = "../marlin-mount-client" }
marlin-vfs = { path = "../marlin-vfs" }
marlin-gdrive = { path = "../marlin-gdrive" }
marlin-test-keychain = { path = "../marlin-test-keychain", optional = true }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "signal", "time", "process"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
uuid = { version = "1.23", features = ["v4"] }

# The helper's library is Unix only until the Windows adapter (#375).
[target.'cfg(unix)'.dependencies]
marlin-sftp = { path = "../marlin-sftp" }
marlin-smb-client = { path = "../marlin-smb-client" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
marlin-fuse = { path = "../marlin-fuse" }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
marlin-test-keychain = { path = "../marlin-test-keychain" }
marlin-test-google = { path = "../marlin-test-google" }
marlin-test-sshd = { path = "../marlin-test-sshd" }
marlin-test-samba = { path = "../marlin-test-samba" }
libc = "0.2"
# For the paused clock in the log test.
tokio = { version = "1.50", features = ["test-util"] }
