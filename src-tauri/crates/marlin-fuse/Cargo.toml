[package]
name = "marlin-fuse"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.89"
description = "Marlin's FUSE mount adapter: serves a marlin-vfs mount through FUSE."

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
marlin-vfs = { path = "../marlin-vfs" }
libc = "0.2"
tokio = { version = "1.50", features = ["rt", "process", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = "=0.19.0"

[target.'cfg(target_os = "macos")'.dependencies]
libloading = "0.9"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
async-trait = "0.1"
