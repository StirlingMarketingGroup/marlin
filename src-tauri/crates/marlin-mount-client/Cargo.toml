[package]
name = "marlin-mount-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.77.2"
description = "What the app links to control Marlin's mount helper: the wire types and the client."

[dependencies]
tokio = { version = "1.50", features = ["rt", "net", "io-util", "sync", "time", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "7.0"
